name: CI TypeScript

on:
  push:
    branches:
      - main
      - master
    paths:
      - "ts/**"
      - "go/scripts/Iso3166Codes.java"
      - ".github/workflows/ci-ts.yml"
  pull_request:
    paths:
      - "ts/**"
      - "go/scripts/Iso3166Codes.java"
      - ".github/workflows/ci-ts.yml"

permissions:
  contents: read

concurrency:
  group: ci-ts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "25"]

    defaults:
      run:
        working-directory: ts

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Vite+ and Node ${{ matrix.node-version }}
        uses: voidzero-dev/setup-vp@237a7eda494c3466dcb53e9f067142b9218d64a1 # v1
        with:
          node-version: ${{ matrix.node-version }}
          cache: true
          working-directory: ts

      - name: Check
        run: vp check

      - name: Test (coverage thresholds from vite.config.ts)
        run: vp test --coverage

      - name: Build
        run: vp pack

      - name: Check license headers
        run: vp exec bun run lint

      - name: Check the header gate rejects a missing or extra copyright line
        if: matrix.node-version == '24'
        run: vp exec bun run check:headers

      - name: Validate the package shape (publint, Are The Types Wrong)
        run: vp exec bun run check:shape

      - name: Verify the npm package (pack, content, publint, throw-away consumer)
        if: matrix.node-version == '24'
        run: scripts/verify-package.sh

      # The ISO 3166-1 table is generated from the JDK pinned in mise.toml; regenerate it here and
      # fail if the committed file drifted from the generator or the generator itself broke.
      - name: Setup Java for the ISO 3166-1 generator
        if: matrix.node-version == '24'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the generated ISO 3166-1 table is up to date
        if: matrix.node-version == '24'
        run: scripts/generate-iso3166.sh --check

      - name: Package dry-run
        run: vp exec bun pm pack --dry-run

  # Early-compatibility canary, not the baseline: the package keeps TypeScript 6 as the supported
  # version (devDependency, release build, consumer smoke). This job swaps in the latest
  # TypeScript 7 on the runner only and proves the sources, the emitted declarations and the
  # packed tarball still type-check with it. `vp check` type-checks through the bundled tsgolint,
  # so the sources are also compiled with TypeScript 7's own `tsc` here.
  ts-next:
    name: TypeScript 7 compatibility (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ts

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Vite+ and Node 24
        uses: voidzero-dev/setup-vp@237a7eda494c3466dcb53e9f067142b9218d64a1 # v1
        with:
          node-version: "24"
          cache: true
          working-directory: ts

      - name: Install the latest TypeScript 7 (runner only, the committed baseline stays 6)
        run: |
          set -euo pipefail
          vp exec bun add --dev typescript@7
          version="$(node_modules/.bin/tsc --version)"
          echo "${version}"
          case "${version}" in
            "Version 7."*) ;;
            *) echo "expected TypeScript 7, got: ${version}" >&2; exit 1 ;;
          esac

      - name: Type-check sources, tests and config with TypeScript 7 tsc
        run: node_modules/.bin/tsc -p tsconfig.json

      - name: Check, test, build, validate the package shape and consume the tarball with TypeScript 7
        run: scripts/verify-package.sh
