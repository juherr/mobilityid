name: Security

# Full SCA of the current dependency set. Not a pull request gate: PRs are covered by
# `dependency-review.yml` (newly introduced high+ vulnerabilities) and `main` by Dependabot
# alerts; this weekly scan catches vulnerabilities disclosed after a dependency was merged.
on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-sca:
    name: Java SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6

      - name: Setup JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6

      - name: Restore OWASP Dependency-Check data
        # The NVD database lives in the Gradle plugin's default data directory
        # (`$GRADLE_USER_HOME/dependency-check-data`), which setup-gradle does not cache.
        # The key is unique per run so the refreshed database is always saved; restore-keys
        # picks the most recent one and the plugin then only downloads the delta.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: |
            dependency-check-data-

      - name: Run OWASP dependency check
        # The plugin is not configuration-cache compatible; do not store then discard a cache entry.
        run: ./gradlew --no-configuration-cache dependencyCheckAnalyze
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload dependency check reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: dependency-check-reports
          path: java/build/reports/dependency-check-report.*
