name: Security

# Full SCA of the current dependency set. Not a pull request gate: PRs are covered by
# `dependency-submission.yml` (newly introduced high+ vulnerabilities) and `main` by Dependabot
# alerts; this weekly scan catches vulnerabilities disclosed after a dependency was merged.
on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-sca:
    name: Java SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Restore OWASP Dependency-Check data
        # The NVD database lives in the Gradle plugin's default data directory
        # (`$GRADLE_USER_HOME/dependency-check-data`), which setup-gradle does not cache.
        # restore-keys picks the most recent database so the plugin only downloads the delta.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: |
            dependency-check-data-

      - name: Run OWASP dependency check
        # The plugin is not configuration-cache compatible; do not store then discard a cache entry.
        run: ./gradlew --no-configuration-cache dependencyCheckAnalyze
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Save OWASP Dependency-Check data
        # Saved even when the scan fails on a finding: the refreshed database is what the rerun needs.
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}

      - name: Upload dependency check reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-check-reports
          path: java/build/reports/dependency-check-report.*
