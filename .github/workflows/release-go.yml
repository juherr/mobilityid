name: Release Go

on:
  push:
    tags:
      - "go/v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-go-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-go:
    name: Release Go module
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GOTOOLCHAIN: local

    defaults:
      run:
        working-directory: go

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go 1.26.x
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.x
          # No cache in a publishing workflow (zizmor cache-poisoning).
          cache: false

      - name: Validate release tag
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ ! "$TAG_NAME" =~ ^go/v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Go release tag: $TAG_NAME"
            exit 1
          fi
          RELEASE_VERSION="${TAG_NAME#go/}"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Download Dependencies
        run: go mod download

      - name: Lint (formatters and license headers included)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.13.2
          working-directory: go
          # No cache in a publishing workflow (zizmor cache-poisoning).
          skip-cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Vulnerability check
        # renovate: datasource=go depName=golang.org/x/vuln
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/go/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "GitHub release already exists for $TAG_NAME"
          else
            gh release create "$TAG_NAME" \
              --title "mobilityid-go ${RELEASE_VERSION}" \
              --generate-notes
          fi
