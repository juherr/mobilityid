name: CI PHP

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'php/**'
      - '.github/workflows/ci-php.yml'
  pull_request:
    paths:
      - 'php/**'
      - '.github/workflows/ci-php.yml'

permissions:
  contents: read

concurrency:
  group: ci-php-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']

    defaults:
      run:
        working-directory: php

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          # Infection (mutation testing, part of `composer check`) needs a coverage driver.
          coverage: pcov

      - name: Install Composer Dependencies
        run: composer install --no-interaction --no-progress

      - name: Run the full gate (validate, normalize, audit, format, PHPStan, Rector, PHPUnit, Infection)
        run: composer check
