name: CI Java

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'java/**'
      - '.github/workflows/ci-java.yml'
  pull_request:
    paths:
      - 'java/**'
      - '.github/workflows/ci-java.yml'

permissions:
  contents: read

concurrency:
  group: ci-java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java-version: ['21', '25']

    defaults:
      run:
        working-directory: java

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup JDK ${{ matrix.java-version }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6

      - name: Check
        run: ./gradlew check

      - name: Build Release Artifacts
        run: ./gradlew javadocJar sourcesJar

      - name: Publish Dry Run
        run: ./gradlew publishToMavenLocal

      - name: Verify release guard wiring
        run: scripts/verify-release-wiring.sh

      - name: Verify isolated consumer (Java + Kotlin, module path)
        run: scripts/verify-consumer.sh

      - name: Upload JaCoCo report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: jacoco-report-jdk-${{ matrix.java-version }}
          path: java/build/reports/jacoco/test/
          if-no-files-found: ignore
