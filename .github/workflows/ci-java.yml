name: CI Java

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'java/**'
      - '.github/workflows/ci-java.yml'
  pull_request:
    paths:
      - 'java/**'
      - '.github/workflows/ci-java.yml'

permissions:
  contents: read

concurrency:
  group: ci-java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java-version: ['21', '25']

    defaults:
      run:
        working-directory: java

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup JDK ${{ matrix.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Check
        run: ./gradlew check

      - name: Build Release Artifacts
        run: ./gradlew javadocJar sourcesJar

      - name: Publish Dry Run
        run: ./gradlew publishToMavenLocal

      - name: Verify release guard wiring
        run: scripts/verify-release-wiring.sh

      - name: Verify isolated consumer (Java on the module path, Kotlin on the classpath)
        run: scripts/verify-consumer.sh

      - name: Upload JaCoCo report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-report-jdk-${{ matrix.java-version }}
          path: java/build/reports/jacoco/test/
          if-no-files-found: ignore

      # Reporting only (diff coverage on PRs, trends): the JaCoCo gate in `check` stays the hard rule.
      - name: Upload coverage to Codecov
        if: matrix.java-version == '21'
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: java/build/reports/jacoco/test/jacocoTestReport.xml
          flags: java
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
