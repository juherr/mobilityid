name: CI Java

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'java/**'
      - '.github/workflows/ci-java.yml'
  pull_request:
    paths:
      - 'java/**'
      - '.github/workflows/ci-java.yml'

permissions:
  contents: read

concurrency:
  group: ci-java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java-version: ['21', '25']

    defaults:
      run:
        working-directory: java

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup JDK ${{ matrix.java-version }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6

      - name: Check
        run: ./gradlew check

      - name: Build Release Artifacts
        run: ./gradlew javadocJar sourcesJar

      - name: Publish Dry Run
        run: ./gradlew publishToMavenLocal
