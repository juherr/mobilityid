name: Dependency Review

# Pull request gate: rejects newly introduced high/critical vulnerabilities in every ecosystem of
# the repository. Manifest-based ecosystems (npm, Composer, Go, Actions) are parsed by GitHub;
# the Java graph comes from `dependency-submission.yml`, which runs on the same pull request.
on:
  pull_request:

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@3c4e3dcb1aa7874d2c16be7d79418e9b7efd6261 # v4
        with:
          fail-on-severity: high
          # Test and build-plugin dependencies count too: Java test/plugin classpaths, npm
          # devDependencies and Composer require-dev are all "development" scope.
          fail-on-scopes: runtime, development, unknown
          # Wait for the Java snapshot of this pull request head instead of reviewing a partial
          # graph. Fork and Dependabot pull requests get no snapshot (see
          # dependency-submission.yml), so do not wait for one there.
          retry-on-snapshot-warnings: >-
            ${{ github.event.pull_request.head.repo.full_name == github.repository
                && github.actor != 'dependabot[bot]' }}
          retry-on-snapshot-warnings-timeout: 600
