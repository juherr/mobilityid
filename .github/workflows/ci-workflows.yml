name: CI Workflows

# Repository policy: every workflow is linted (actionlint) and audited (zizmor) on change.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'mise.toml'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'mise.toml'

permissions:
  contents: read

concurrency:
  group: ci-workflows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up workflow linters
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: actionlint zizmor

      - name: Lint GitHub Actions
        run: |
          actionlint -color
          zizmor --min-severity medium .github/workflows

  release-scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run script tests
        run: scripts/tests/run.sh
