name: Trusted Dependency Review

# The dependency review that can be required on `main`: computed by this workflow, which only
# runs from the default branch, and published as the `Trusted dependency review` commit status
# on the pull request head by a dedicated GitHub App whose key lives in the `trusted-review`
# environment (deployment branch policy: `main` only).
#
# Why not the `Dependency review` job of dependency-submission.yml: a `pull_request` run executes
# the pull request's own workflow files, so any pull request author (fork or same-repository
# branch) can rename or neuter that job, and every check or GITHUB_TOKEN status it produces
# comes from the "GitHub Actions" source, which a required check cannot tell apart from a forged
# one. Here the review runs from `main`'s definition for every pull request, and the App key is
# out of reach of `pull_request` runs: repository secrets would be readable by any same-repository
# branch, environment secrets only by jobs whose run ref matches the environment's branch policy.
#
# Every pull request gets its Java graph submitted here (job `submit`): no `pull_request` run
# holds a write token, so dependency-submission.yml uploads the graph of the head commit as an
# artifact and this workflow submits it once scripts/validate-dependency-graph-provenance.sh has
# bound it to the triggering run and its pull request (checks and threat model documented there,
# policy in CONTRIBUTING.md); a run that uploaded nothing, or a forged snapshot, fails here and
# the status is a failure. No pull request code runs here: the checkout is a sparse checkout of
# the default branch limited to `scripts/`, and the only untrusted input is that JSON file,
# whose size is not bounded before download (worst case: the job's `timeout-minutes`). The
# graph content itself is produced by the pull request, which can hide a dependency from its
# own review, the same exposure as editing the build files, limited to that pull request.
#
# The check runs of a `workflow_run` workflow are attached to the default-branch commit, not to
# the pull request, hence the commit status (job `status`, run even on failure). A commit status
# is per commit, whatever branch or fork carries the commit: the review set is every open pull
# request whose head is that commit (job `pulls`), the concurrency group is the commit, and a
# previous success on that commit is reset to `pending` before anything else (job `pending`):
# as early as `requested` or `in_progress` (the only event a re-run emits before `completed`),
# and again, as the first job of the `completed` run, since those early runs share the
# concurrency group and may be cancelled by it. Nothing is reviewed until that reset succeeded;
# an unconfigured App fails it. Changes to the review set or to a base that produce no new
# commit (pull request retargeted, reopened or closed) are caught by pull-request-lifecycle.yml,
# which re-runs `Dependency Submission` for the head so this workflow recomputes. A
# `workflow_run` workflow only triggers from the default branch, so changes to this file take
# effect once merged.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] no checkout of the triggering ref; the artifact is validated before use
    workflows:
      - Dependency Submission
    types:
      - requested
      - in_progress
      - completed

permissions: {}

# Per commit, like the status: sibling runs (several pull requests, branches or forks at the
# same sha) supersede each other and the survivor reviews every pull request of that commit.
concurrency:
  group: trusted-dependency-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

env:
  # Job correlator gradle/actions derives from the triggering workflow and job names
  # (`Dependency Submission` / `java-graph`); the artifact is named after it.
  CORRELATOR: dependency_submission-java-graph
  # Pull requests the triggering run knows it belongs to: populated for same-repository and
  # Dependabot runs, empty for forks (GitHub does not fill it for them). Only binds the snapshot
  # provenance (job `submit`): the review set is never reduced to them, see job `pulls`.
  TRUSTED_PULLS: ${{ join(github.event.workflow_run.pull_requests.*.number, ',') }}

jobs:
  pending:
    name: Reset the trusted dependency review status
    # A previous success on that commit (another pull request, another base, an earlier
    # attempt) must not be inherited while the review is being recomputed: reset as soon as the
    # pull request run is requested or starts, and first thing on completion (the review jobs
    # depend on this one). The App is a prerequisite of the required check: missing
    # credentials fail here, they are never skipped.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: trusted-review
    permissions:
      contents: read

    steps:
      - name: Require the dependency review App
        if: vars.DEPENDENCY_REVIEW_APP_CLIENT_ID == ''
        run: |
          echo "::error::DEPENDENCY_REVIEW_APP_CLIENT_ID is not set in the trusted-review environment (see CONTRIBUTING.md)"
          exit 1

      - name: Checkout scripts of the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Mint the status token of the dependency review App
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEPENDENCY_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_REVIEW_APP_PRIVATE_KEY }}
          permission-statuses: write

      - name: Report the pending status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/report-trusted-review-status.sh "$HEAD_SHA" pending "$RUN_URL"

  pulls:
    name: Open pull requests of the head
    # The commit status is per commit and shared by every open pull request whose head is this
    # commit (siblings with different bases, branches or forks included; their runs even share
    # the concurrency group above), so each of their bases is reviewed below (matrix) and the
    # set is the same whichever run survives: all of them, never only the triggering run's own.
    needs: pending
    if: >-
      github.event.action == 'completed'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.list.outputs.pulls }}

    steps:
      - name: Checkout scripts of the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: List them with their base
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Every open pull request, whatever its head branch or repository: filtered on the sha.
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[]' | jq -s '.' > pulls.json
          pulls=$(scripts/list-pull-requests-of-head.sh pulls.json "$HEAD_SHA")
          echo "pulls=${pulls}" >> "$GITHUB_OUTPUT"

  submit:
    name: Submit the Java dependency graph
    # Every pull request run; cancelled runs left no artifact (the concurrency group of the
    # triggering workflow supersedes them). A run that uploaded nothing fails here.
    needs: pending
    if: >-
      github.event.action == 'completed'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: read

    steps:
      - name: Checkout scripts of the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Select the uploaded graph
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # A re-run keeps the artifacts of the previous attempts on the same run id, so the
          # artifact is selected explicitly (latest non-expired one of that name for that head).
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?name=dependency-graph_${CORRELATOR}.json" \
            > "$RUNNER_TEMP/artifacts.json"
          artifact_id=$(scripts/select-dependency-graph-artifact.sh "$RUNNER_TEMP/artifacts.json" \
            "dependency-graph_${CORRELATOR}.json" "$HEAD_SHA")
          echo "artifact-id=${artifact_id}" >> "$GITHUB_OUTPUT"

      - name: Download it outside the workspace
        # The artifact is pull request content: extracted under the runner temp directory, never
        # in the workspace holding the trusted scripts, and only the expected file is read.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.select.outputs.artifact-id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/snapshot

      - name: Locate the snapshot
        id: download
        run: |
          # The artifact keeps the workspace-relative path of the report (gradle/actions default
          # `dependency-graph-report-dir`); anything else packed into it is ignored.
          snapshot="$RUNNER_TEMP/snapshot/dependency-graph-reports/${CORRELATOR}.json"
          if [[ ! -f "${snapshot}" ]]; then
            echo "::error::dependency-graph-reports/${CORRELATOR}.json is missing from the artifact"
            exit 1
          fi
          echo "snapshot=${snapshot}" >> "$GITHUB_OUTPUT"

      - name: List the open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[]' | jq -s '.' > "$RUNNER_TEMP/pulls.json"

      - name: Validate the snapshot provenance
        env:
          SNAPSHOT: ${{ steps.download.outputs.snapshot }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          scripts/validate-dependency-graph-provenance.sh \
            "$SNAPSHOT" "$RUNNER_TEMP/pulls.json" "$HEAD_SHA" "$RUN_ID" "$CORRELATOR" "$HEAD_REPO" "$TRUSTED_PULLS"

      - name: Verify the snapshot carries the resolved transitive dependencies
        env:
          SNAPSHOT: ${{ steps.download.outputs.snapshot }}
        run: scripts/verify-dependency-graph.sh "$SNAPSHOT"

      - name: Submit the snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT: ${{ steps.download.outputs.snapshot }}
        # The API answers 201 even when it rejects the snapshot (`result: INVALID`), so the
        # response body is checked rather than the status code.
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
            --input "$SNAPSHOT" > "$RUNNER_TEMP/response.json"
          result=$(jq -r '.result // "MISSING"' "$RUNNER_TEMP/response.json")
          echo "Submitted $SNAPSHOT: ${result} ($(jq -r '.message // ""' "$RUNNER_TEMP/response.json"))"
          if [[ "${result}" != "SUCCESS" && "${result}" != "ACCEPTED" ]]; then
            echo "::error::Dependency Submission API did not accept the snapshot: ${result}"
            exit 1
          fi

  review:
    name: Trusted dependency review (#${{ matrix.pull.number }})
    # One leg per open pull request of the head, against its own base: same thresholds as
    # `Dependency review` in dependency-submission.yml (keep them in sync), on the graph
    # submitted by `submit` above, never without it. Separate job so the review action never
    # holds `contents: write`.
    needs:
      - pulls
      - submit
    if: needs.pulls.result == 'success' && needs.submit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pull: ${{ fromJSON(needs.pulls.outputs.matrix) }}

    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ matrix.pull.base }}
          head-ref: ${{ github.event.workflow_run.head_sha }}
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120

  status:
    name: Report the trusted dependency review status
    # Publishes the outcome on the pull request head commit whatever happened above, so that a
    # required `Trusted dependency review` status never stays pending on a failure: success only
    # when every review leg (one per open pull request of that head) passed. The App key
    # is an environment secret: the `trusted-review` environment only accepts `main`, which a
    # `pull_request` run never is, so no pull request can mint this token.
    needs:
      - pending
      - pulls
      - submit
      - review
    if: >-
      always()
      && needs.pending.result == 'success'
      && github.event.action == 'completed'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: trusted-review
    permissions:
      contents: read

    steps:
      - name: Checkout scripts of the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Mint the status token of the dependency review App
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEPENDENCY_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_REVIEW_APP_PRIVATE_KEY }}
          permission-statuses: write

      - name: Report the status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          STATE: ${{ needs.review.result == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/report-trusted-review-status.sh "$HEAD_SHA" "$STATE" "$RUN_URL"
