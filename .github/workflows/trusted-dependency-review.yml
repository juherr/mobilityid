name: Trusted Dependency Review

# The dependency review to require on `main`: computed here, from `main`'s definition, for every
# pull request, and published as the `Trusted dependency review` commit status on the pull
# request head by a dedicated GitHub App (a `workflow_run` workflow's own check runs are attached
# to the `main` commit). Design, trust model, setup and post-merge checks: CONTRIBUTING.md,
# "Dependency review gate". Invariants this file must keep:
#   - the App key (`trusted-review` environment) is only used by jobs that neither check out,
#     download nor execute pull request content; the only checkout anywhere is `scripts/` of
#     `main`, and the pull request's artifact is extracted under the runner temp directory;
#   - `pending` runs first, on every event, and every other job depends on it: a success already
#     on the commit is never valid during a recomputation, and a missing App fails, never skips;
#   - `review` never runs without `submit` having validated and submitted the graph;
#   - the review set and the concurrency group are the commit (every open pull request at that
#     sha, whatever its branch or fork), the status is green only when every leg passed.
# A `workflow_run` workflow only triggers from the default branch: changes here apply once merged.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] no checkout of the triggering ref; the artifact is validated before use
    workflows:
      - Dependency Submission
    types:
      - requested
      - in_progress
      - completed

permissions: {}

concurrency:
  group: trusted-dependency-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

env:
  # Job correlator pinned by dependency-submission.yml; the artifact is named after it.
  CORRELATOR: dependency_submission-java-graph
  # Pull requests the triggering run knows it belongs to (empty for fork runs). Provenance only:
  # the review set (job `pulls`) is never reduced to them.
  TRUSTED_PULLS: ${{ join(github.event.workflow_run.pull_requests.*.number, ',') }}

jobs:
  pending:
    name: Reset the trusted dependency review status
    # Early on `requested`/`in_progress` (a re-run emits no `requested`), and again first thing
    # on `completed`: those early runs share the concurrency group and may be cancelled.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: trusted-review
    permissions:
      contents: read

    steps:
      - name: Require the dependency review App
        if: vars.DEPENDENCY_REVIEW_APP_CLIENT_ID == ''
        run: |
          echo "::error::DEPENDENCY_REVIEW_APP_CLIENT_ID is not set in the trusted-review environment (see CONTRIBUTING.md)"
          exit 1

      - name: Checkout scripts of the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Mint the status token of the dependency review App
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEPENDENCY_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_REVIEW_APP_PRIVATE_KEY }}
          permission-statuses: write

      - name: Report the pending status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/report-trusted-review-status.sh "$HEAD_SHA" pending "$RUN_URL"

  pulls:
    name: Open pull requests of the head
    needs: pending
    if: >-
      github.event.action == 'completed'
      && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.list.outputs.pulls }}

    steps:
      - name: Checkout scripts of the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: List them with their base
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[]' | jq -s '.' > "$RUNNER_TEMP/pulls.json"
          pulls=$(scripts/list-pull-requests-of-head.sh "$RUNNER_TEMP/pulls.json" "$HEAD_SHA")
          echo "pulls=${pulls}" >> "$GITHUB_OUTPUT"

  submit:
    name: Submit the Java dependency graph
    # Cancelled runs left no artifact (superseded by the triggering workflow's concurrency
    # group); any other run that uploaded nothing fails here.
    needs: pending
    if: >-
      github.event.action == 'completed'
      && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: read

    steps:
      - name: Checkout scripts of the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Select the uploaded graph
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # A re-run keeps the artifacts of the previous attempts on the same run id.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?name=dependency-graph_${CORRELATOR}.json" \
            > "$RUNNER_TEMP/artifacts.json"
          artifact_id=$(scripts/select-dependency-graph-artifact.sh "$RUNNER_TEMP/artifacts.json" \
            "dependency-graph_${CORRELATOR}.json" "$HEAD_SHA")
          echo "artifact-id=${artifact_id}" >> "$GITHUB_OUTPUT"

      - name: Download it outside the workspace
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.select.outputs.artifact-id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/snapshot

      - name: Locate the snapshot
        id: download
        run: |
          # gradle/actions' default `dependency-graph-report-dir`; anything else in the artifact is ignored.
          snapshot="$RUNNER_TEMP/snapshot/dependency-graph-reports/${CORRELATOR}.json"
          if [[ ! -f "${snapshot}" ]]; then
            echo "::error::dependency-graph-reports/${CORRELATOR}.json is missing from the artifact"
            exit 1
          fi
          echo "snapshot=${snapshot}" >> "$GITHUB_OUTPUT"

      - name: Fetch the pull request the snapshot names
        # The number is only parsed out of the untrusted file to look the pull request up (any
        # state); the provenance script does every check.
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT: ${{ steps.download.outputs.snapshot }}
        run: |
          number=$(jq -r '.ref // "" | capture("^refs/pull/(?<n>[0-9]+)/merge$").n // empty' "$SNAPSHOT" || true)
          if [[ -n "${number}" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/${number}" | jq -s '.' > "$RUNNER_TEMP/pulls.json" || echo '[]' > "$RUNNER_TEMP/pulls.json"
          else
            echo '[]' > "$RUNNER_TEMP/pulls.json"
          fi

      - name: Validate the snapshot provenance
        env:
          SNAPSHOT: ${{ steps.download.outputs.snapshot }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          scripts/validate-dependency-graph-provenance.sh \
            "$SNAPSHOT" "$RUNNER_TEMP/pulls.json" "$HEAD_SHA" "$RUN_ID" "$CORRELATOR" "$HEAD_REPO" "$TRUSTED_PULLS"

      - name: Verify the snapshot carries the resolved transitive dependencies
        env:
          SNAPSHOT: ${{ steps.download.outputs.snapshot }}
        run: scripts/verify-dependency-graph.sh "$SNAPSHOT"

      - name: Submit the snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT: ${{ steps.download.outputs.snapshot }}
        # The API answers 201 even when it rejects the snapshot (`result: INVALID`), so the
        # response body is checked rather than the status code.
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
            --input "$SNAPSHOT" > "$RUNNER_TEMP/response.json"
          result=$(jq -r '.result // "MISSING"' "$RUNNER_TEMP/response.json")
          echo "Submitted $SNAPSHOT: ${result} ($(jq -r '.message // ""' "$RUNNER_TEMP/response.json"))"
          if [[ "${result}" != "SUCCESS" && "${result}" != "ACCEPTED" ]]; then
            echo "::error::Dependency Submission API did not accept the snapshot: ${result}"
            exit 1
          fi

  review:
    name: Trusted dependency review (#${{ matrix.pull.number }})
    # One leg per open pull request of the head, against its own base; same thresholds as
    # `Dependency review` in dependency-submission.yml (keep them in sync). Separate job so the
    # review action never holds `contents: write`.
    needs:
      - pulls
      - submit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pull: ${{ fromJSON(needs.pulls.outputs.matrix) }}

    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ matrix.pull.base }}
          head-ref: ${{ github.event.workflow_run.head_sha }}
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120

  status:
    name: Report the trusted dependency review status
    # Whatever happened above, so that a required status never stays pending on a failure.
    needs:
      - pending
      - pulls
      - submit
      - review
    if: >-
      always()
      && needs.pending.result == 'success'
      && github.event.action == 'completed'
      && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: trusted-review
    permissions:
      contents: read

    steps:
      - name: Checkout scripts of the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Mint the status token of the dependency review App
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.DEPENDENCY_REVIEW_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPENDENCY_REVIEW_APP_PRIVATE_KEY }}
          permission-statuses: write

      - name: Report the status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          STATE: ${{ needs.review.result == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/report-trusted-review-status.sh "$HEAD_SHA" "$STATE" "$RUN_URL"
