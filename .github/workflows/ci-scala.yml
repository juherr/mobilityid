name: CI Scala

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'scala/**'
      - 'scripts/mima-baseline.sh'
      - '.github/workflows/ci-scala.yml'
  pull_request:
    paths:
      - 'scala/**'
      - 'scripts/mima-baseline.sh'
      - '.github/workflows/ci-scala.yml'

permissions:
  contents: read

concurrency:
  group: ci-scala-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scala:
    name: Scala (JDK 25, Scala ${{ matrix.scala-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scala-version: [2.13.18, 3.9.0]

    defaults:
      run:
        working-directory: scala

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@dd1ef7d7798fab5ce802a6adab3b782817b8c2d0 # v1

      - name: Resolve the MiMa baseline (last Scala release on Maven Central)
        shell: bash
        run: |
          set -euo pipefail
          status=0
          baseline=$(../scripts/mima-baseline.sh) || status=$?
          case "${status}" in
            0) echo "MIMA_OPTION=-Dmobilityid.mimaBaseline=${baseline}" >> "${GITHUB_ENV}"; echo "MiMa baseline: ${baseline}" ;;
            1) echo "MIMA_OPTION=" >> "${GITHUB_ENV}"; echo "MiMa baseline: none published yet" ;;
            *) echo "Could not resolve the MiMa baseline (exit ${status})" >&2; exit 1 ;;
          esac

      - name: Headers, Scalafmt, Scalafix, tests and MiMa
        shell: bash
        run: |
          set -euo pipefail
          # sbt 2 runs a command sequence from one quoted argument; --server --batch runs it in a
          # fresh JVM so that no long-lived server keeps a stale environment.
          sbt --server --batch ${MIMA_OPTION:+"${MIMA_OPTION}"} \
            "++${SCALA_VERSION}; headerCheckAll; scalafmtCheckAll; scalafmtSbtCheck; scalafixAll --check; test; mimaReportBinaryIssues"
        env:
          SCALA_VERSION: ${{ matrix.scala-version }}

  release-wiring:
    name: Release guard and consumer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: scala

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@dd1ef7d7798fab5ce802a6adab3b782817b8c2d0 # v1

      - name: Verify the release guard wiring (SNAPSHOT, credentials, GPG key, MiMa baseline)
        run: scripts/verify-release-wiring.sh

      - name: Publish to an isolated repository and consume it from consumer-smoke/
        run: scripts/verify-consumer.sh
