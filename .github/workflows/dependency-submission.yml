name: Dependency Submission

# Submits the resolved Gradle dependency graph of `java/` (direct and transitive, including the
# build-plugin classpath) to the GitHub Dependency Graph, then runs Dependency Review on pull
# requests. GitHub cannot parse Gradle builds itself, so without this submission neither
# Dependency Review nor Dependabot alerts see any Java dependency. No path filter on purpose:
# Dependency Review compares the snapshot of the pull request head with the one of its merge
# base on `main`, so every commit of `main` and every pull request head needs a snapshot.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-graph:
    name: Java dependency graph
    # The Dependency Submission API needs `contents: write`, which GITHUB_TOKEN never has for a
    # pull request from a fork (or from Dependabot). Those pull requests are skipped here and get
    # no Java dependency review (see CONTRIBUTING.md); the push to `main` after merge submits
    # their graph and Dependabot alerts take over.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate and submit dependency graph
        id: graph
        uses: gradle/actions/dependency-submission@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6
        with:
          build-root-directory: java
          dependency-graph: generate-and-submit
          # No graph is produced when the configuration is loaded from the configuration cache.
          additional-arguments: --no-configuration-cache

      - name: Verify the snapshot carries the resolved transitive dependencies
        env:
          SNAPSHOT: ${{ steps.graph.outputs.dependency-graph-file }}
        run: scripts/verify-dependency-graph.sh "$SNAPSHOT"

  dependency-review:
    name: Dependency review
    # Pull request security gate: green means "the Java graph was submitted successfully when it
    # applied, and Dependency Review found no newly introduced high/critical vulnerability".
    # Manifest-based ecosystems (npm, Composer, Go, Actions) are parsed by GitHub; the Java graph
    # is the snapshot submitted by the job above, hence `needs`: the review never runs before the
    # submission has completed (when both sides lack a snapshot GitHub raises no warning, so
    # `retry-on-snapshot-warnings` alone cannot close that race). The job runs even when the
    # submission failed and fails itself, because a skipped job satisfies a required status
    # check. Fork and Dependabot pull requests have the submission skipped and are reviewed on
    # the manifest ecosystems only.
    needs: java-graph
    if: github.event_name == 'pull_request' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Require the Java dependency graph
        if: needs.java-graph.result != 'skipped'
        env:
          RESULT: ${{ needs.java-graph.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "::error::Java dependency graph job ended with '$RESULT'; the review cannot vouch for Java"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Test and build-plugin dependencies count too: Java test/plugin classpaths, npm
          # devDependencies and Composer require-dev are all "development" scope.
          fail-on-scopes: runtime, development, unknown
          # Second guard for the propagation delay between the submission and the compare API.
          retry-on-snapshot-warnings: ${{ needs.java-graph.result == 'success' }}
          retry-on-snapshot-warnings-timeout: 120
