name: Dependency Submission

# Submits the resolved Gradle dependency graph of `java/` (direct and transitive, including the
# build-plugin classpath) to the GitHub Dependency Graph, then runs Dependency Review on pull
# requests. GitHub cannot parse Gradle builds itself, so without this submission neither
# Dependency Review nor Dependabot alerts see any Java dependency. No path filter on purpose:
# Dependency Review compares the snapshot of the pull request head with the one of its merge
# base on `main`, so every commit of `main` and every pull request head needs a snapshot.
#
# Only `main` submits directly (`contents: write`). A `pull_request` run executes the pull
# request's own workflow files, so no pull request run holds a write token: it generates the
# graph of its head commit and uploads it as an artifact, and `trusted-dependency-review.yml`
# (a `workflow_run` from `main`) validates its provenance, submits it and reviews it.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-graph:
    name: Java dependency graph
    # Trusted executions only: the default branch, pushed or dispatched.
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6

      - name: Setup JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Generate and submit dependency graph
        id: graph
        uses: gradle/actions/dependency-submission@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6
        with:
          build-root-directory: java
          dependency-graph: generate-and-submit
          # No graph is produced when the configuration is loaded from the configuration cache.
          additional-arguments: --no-configuration-cache

      - name: Verify the snapshot carries the resolved transitive dependencies
        env:
          SNAPSHOT: ${{ steps.graph.outputs.dependency-graph-file }}
        run: scripts/verify-dependency-graph.sh "$SNAPSHOT"

  java-graph-upload:
    name: Java dependency graph (upload)
    # Every pull request, fork or same-repository: same steps as above, read-only token, graph
    # uploaded for `trusted-dependency-review.yml`. Generated from the head commit, not from the
    # merge commit of the default checkout: the snapshot is recorded for the head sha, which
    # sibling pull requests towards different bases share.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Job correlator (and artifact name) expected by trusted-dependency-review.yml; the value
      # gradle/actions would derive for the `java-graph` job above, kept stable on purpose.
      GITHUB_DEPENDENCY_GRAPH_JOB_CORRELATOR: dependency_submission-java-graph

    steps:
      - name: Checkout the head commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6

      - name: Setup JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Generate and upload dependency graph
        id: graph
        uses: gradle/actions/dependency-submission@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6
        with:
          build-root-directory: java
          dependency-graph: generate-and-upload
          # The artifact only has to outlive the `workflow_run` hop.
          artifact-retention-days: 1
          # No graph is produced when the configuration is loaded from the configuration cache.
          additional-arguments: --no-configuration-cache

      - name: Verify the snapshot carries the resolved transitive dependencies
        env:
          SNAPSHOT: ${{ steps.graph.outputs.dependency-graph-file }}
        run: scripts/verify-dependency-graph.sh "$SNAPSHOT"

  dependency-review:
    name: Dependency review
    # Fast feedback inside the pull request run, on the manifest ecosystems GitHub parses itself
    # (npm, Composer, Go, Actions): the Java graph of the head is not submitted yet at this
    # point. This run is controlled by the pull request author, so the review to require on
    # `main` is the `Trusted dependency review` status (`trusted-dependency-review.yml`),
    # computed from `main` once this workflow completes, Java included. The job runs even when
    # the upload failed and fails itself, because a skipped job satisfies a required check.
    needs: java-graph-upload
    if: github.event_name == 'pull_request' && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Require the Java dependency graph upload
        env:
          RESULT: ${{ needs.java-graph-upload.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "::error::Java dependency graph job ended with '$RESULT'; no graph for the trusted review"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Test and build-plugin dependencies count too: Java test/plugin classpaths, npm
          # devDependencies and Composer require-dev are all "development" scope.
          fail-on-scopes: runtime, development, unknown
