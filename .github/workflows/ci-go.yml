name: CI Go

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'go/**'
      - '.github/workflows/ci-go.yml'
  pull_request:
    paths:
      - 'go/**'
      - '.github/workflows/ci-go.yml'

permissions:
  contents: read

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # go.mod declares the oldest supported Go; each leg must run its own toolchain.
        go-version: ['1.26.x', '1.27.x']

    env:
      GOTOOLCHAIN: local

    defaults:
      run:
        working-directory: go

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: go/go.sum

      - name: Download Dependencies
        run: go mod download

      - name: Lint (formatters and license headers included)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # renovate: datasource=github-releases depName=golangci/golangci-lint
          version: v2.13.2
          working-directory: go

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Check the retract directives repair `@latest`
        run: scripts/tests/retract.test.sh

      - name: Vulnerability check
        # renovate: datasource=go depName=golang.org/x/vuln
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...