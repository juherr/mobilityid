name: Release PHP

# Packagist only indexes a repository whose composer.json sits at its root, so the php/ workspace
# is mirrored to a read-only split repository on every php/vX.Y.Z tag. Packagist follows that
# mirror through its GitHub webhook; no token is needed on this side beyond the deploy key.

on:
  push:
    tags:
      - "php/v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-php-${{ github.ref }}
  cancel-in-progress: false

env:
  MIRROR_REPOSITORY: juherr/mobility-id-php

jobs:
  release-php:
    name: Release PHP package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: packagist

    defaults:
      run:
        working-directory: php

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # git subtree split needs the whole history of php/.
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: '8.4'
          extensions: intl
          tools: composer
          coverage: pcov

      - name: Validate release tag
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [[ ! "$TAG_NAME" =~ ^php/v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid PHP release tag: $TAG_NAME"
            exit 1
          fi
          RELEASE_VERSION="${TAG_NAME#php/}"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Run the full gate
        run: composer check

      - name: Split the php/ workspace
        shell: bash
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SPLIT_SHA="$(git subtree split --prefix=php HEAD)"
          echo "SPLIT_SHA=$SPLIT_SHA" >> "$GITHUB_ENV"
          echo "php/ splits to $SPLIT_SHA"

      - name: Push the split to the mirror repository
        shell: bash
        working-directory: .
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.PHP_MIRROR_DEPLOY_KEY }}
        run: |
          if [ -z "$MIRROR_DEPLOY_KEY" ]; then
            echo "PHP_MIRROR_DEPLOY_KEY is not set in the packagist environment"
            exit 1
          fi
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$MIRROR_DEPLOY_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          MIRROR="git@github.com:${MIRROR_REPOSITORY}.git"

          EXISTING="$(git ls-remote --tags "$MIRROR" "refs/tags/${RELEASE_VERSION}" | cut -f1)"
          if [ -n "$EXISTING" ]; then
            if [ "$EXISTING" = "$SPLIT_SHA" ]; then
              echo "Mirror already carries ${RELEASE_VERSION} at ${SPLIT_SHA}, nothing to push"
              exit 0
            fi
            echo "Mirror tag ${RELEASE_VERSION} points at ${EXISTING}, not at the split ${SPLIT_SHA}; refusing to move a published tag"
            exit 1
          fi

          git push "$MIRROR" "${SPLIT_SHA}:refs/heads/main"
          git push "$MIRROR" "${SPLIT_SHA}:refs/tags/${RELEASE_VERSION}"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/php/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "GitHub release already exists for $TAG_NAME"
          else
            gh release create "$TAG_NAME" \
              --title "mobility-id (PHP) ${RELEASE_VERSION}" \
              --generate-notes
          fi
