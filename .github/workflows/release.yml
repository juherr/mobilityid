name: Release

# Manually dispatched from main with the version as input. Every non-destructive check (version,
# changelog, Java, TypeScript, PHP and Scala verification) runs before any registry is touched,
# then Java and Scala (Maven Central), TypeScript (npm) and PHP (the `php/` split pushed to the
# Packagist mirror) are published idempotently, and the signed `vX.Y.Z` tag and the GitHub
# Release are created only once every registry has accepted the artifacts. Re-run a failed run (`gh run rerun <id> --failed`)
# instead of dispatching again: every job is idempotent and keeps the original commit.
# Go is released separately from `go/vX.Y.Z` tags (release-go.yml).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (X.Y.Z or X.Y.Z-prerelease)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version, changelog and release notes
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || { echo "Releases run from main only" >&2; exit 1; }
          # Same rules for every registry (node-semver strictness, no build metadata, no SNAPSHOT):
          # nothing may be published to the immutable Maven Central before npm would reject the version.
          scripts/validate-release-version.sh "${RELEASE_VERSION}"
          grep -Fq "## [${RELEASE_VERSION}] - " CHANGELOG.md || { echo "CHANGELOG.md has no dated section for ${RELEASE_VERSION}" >&2; exit 1; }
          test -s ".github/release-notes/${RELEASE_VERSION}.md" || { echo "Missing .github/release-notes/${RELEASE_VERSION}.md" >&2; exit 1; }

      - name: Check existing tag
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          remote_tag=$(git ls-remote --tags origin "refs/tags/${tag}^{}" | awk '{print $1}')
          if [[ -z "${remote_tag}" ]]; then
            remote_tag=$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')
          fi
          if [[ -n "${remote_tag}" && "${remote_tag}" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${tag} already points to ${remote_tag}, not ${GITHUB_SHA}." >&2
            exit 1
          fi

  preflight-java:
    name: Preflight Java
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: maven-central
    defaults:
      run:
        working-directory: java
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check Maven Central credentials and signing inputs
        shell: bash
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "${CENTRAL_USERNAME}"
          test -n "${CENTRAL_TOKEN}"
          test -n "${GPG_PRIVATE_KEY}"
          test -n "${GPG_PASSPHRASE}"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6
        with:
          cache-disabled: true

      - name: Verify project (gates, release guard wiring, consumer smoke)
        run: scripts/verify.sh

  preflight-ts:
    name: Preflight TypeScript
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    defaults:
      run:
        working-directory: ts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Vite+ and Node 24
        uses: voidzero-dev/setup-vp@237a7eda494c3466dcb53e9f067142b9218d64a1 # v1
        with:
          node-version: "24"
          cache: false
          working-directory: ts

      - name: Build, pack, verify the tarball and consume it from a throw-away project
        run: scripts/verify-package.sh "${RELEASE_VERSION}" "${RUNNER_TEMP}/npm-package"

      - name: Upload the verified tarball
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/juherr-mobilityid-${{ inputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  preflight-php:
    name: Preflight PHP
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: packagist
    defaults:
      run:
        working-directory: php
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the Packagist mirror deploy key is present
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.PHP_MIRROR_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${MIRROR_DEPLOY_KEY}" ]]; then
            echo "PHP_MIRROR_DEPLOY_KEY is not set in the packagist environment" >&2
            exit 1
          fi

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2
        with:
          php-version: "8.4"
          tools: composer
          # Infection (part of `composer check`) needs a coverage driver.
          coverage: pcov

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Run the full gate (validate, normalize, audit, format, PHPStan, Rector, PHPUnit, Infection)
        run: composer check

  preflight-scala:
    name: Preflight Scala
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: maven-central
    defaults:
      run:
        working-directory: scala
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check Maven Central credentials and signing inputs
        shell: bash
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "${CENTRAL_USERNAME}"
          test -n "${CENTRAL_TOKEN}"
          test -n "${GPG_PRIVATE_KEY}"
          test -n "${GPG_PASSPHRASE}"

      - name: Setup JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup sbt
        uses: sbt/setup-sbt@dd1ef7d7798fab5ce802a6adab3b782817b8c2d0 # v1

      - name: Verify project (gates on every Scala version, release guard wiring, consumer smoke)
        run: scripts/verify.sh

  release-java:
    name: Release Java to Maven Central
    # Every preflight must pass so that no registry receives the version while another
    # workspace would fail its own verification; the publish itself stays idempotent.
    needs: [preflight-java, preflight-ts, preflight-php, preflight-scala]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: maven-central
    defaults:
      run:
        working-directory: java
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.CENTRAL_TOKEN }}
      SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      SIGNING_PASSWORD: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f # v6
        with:
          # No cache in a publishing workflow (zizmor cache-poisoning).
          cache-disabled: true

      - name: Publish to Maven Central
        shell: bash
        run: |
          set -euo pipefail
          status=0
          ../scripts/check-central-release.sh "${RELEASE_VERSION}" || status=$?
          if [[ "${status}" -eq 0 ]]; then
            echo "Release ${RELEASE_VERSION} is already available from Maven Central; skipping upload."
            exit 0
          fi
          if [[ "${status}" -ne 1 ]]; then
            echo "Could not determine whether ${RELEASE_VERSION} is published; refusing to upload." >&2
            exit "${status}"
          fi
          ./gradlew -PreleaseVersion="${RELEASE_VERSION}" publishAggregationToCentralPortal

      - name: Wait for Maven Central resolution
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            status=0
            ../scripts/check-central-release.sh "${RELEASE_VERSION}" || status=$?
            if [[ "${status}" -eq 0 ]]; then
              exit 0
            fi
            sleep 30
          done
          echo "Release did not become resolvable from Maven Central in time." >&2
          echo "Check https://central.sonatype.com/publishing/deployments, then re-run this failed job." >&2
          exit 1

  release-ts:
    name: Release TypeScript to npm
    needs: [preflight-java, preflight-ts, preflight-php, preflight-scala]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # npm Trusted Publishing (OIDC): this job is bound on npmjs.com to this exact workflow file
    # name (release.yml) and, optionally, to the `npm` environment. No npm token anywhere.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check npm supports trusted publishing (>= 11.5.1)
        shell: bash
        run: |
          set -euo pipefail
          npm --version
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error("npm >= 11.5.1 required"); process.exit(1); }' "$(npm --version)"

      - name: Download the verified tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package

      - name: Publish the verified tarball to npm (OIDC, provenance generated by npm)
        shell: bash
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/npm-package/juherr-mobilityid-${RELEASE_VERSION}.tgz"
          scripts/verify-npm-package.sh "${tarball}" "${RELEASE_VERSION}"
          if npm view "@juherr/mobilityid@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "@juherr/mobilityid@${RELEASE_VERSION} is already on npm; skipping publish."
            exit 0
          fi
          if [[ "${RELEASE_VERSION}" == *-* ]]; then
            npm_tag="next"
          else
            npm_tag="latest"
          fi
          npm publish "${tarball}" --tag "${npm_tag}"

  release-php:
    name: Release PHP to the Packagist mirror
    needs: [preflight-java, preflight-ts, preflight-php, preflight-scala]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Packagist only indexes a repository whose composer.json sits at its root, so the php/
    # workspace is mirrored to a read-only split repository that Packagist follows through its
    # GitHub hook. The mirror is written with a deploy key; nothing else is needed on this side.
    environment: packagist
    env:
      MIRROR_REPOSITORY: juherr/mobility-id-php
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # git subtree split needs the whole history of php/.
          fetch-depth: 0

      - name: Split the php/ workspace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mobilityid release workflow"
          git config user.email "actions@users.noreply.github.com"
          split_sha="$(git subtree split --prefix=php "${GITHUB_SHA}")"
          echo "SPLIT_SHA=${split_sha}" >> "${GITHUB_ENV}"
          echo "php/ at ${GITHUB_SHA} splits to ${split_sha}"

      - name: Push the split to the mirror repository
        shell: bash
        env:
          MIRROR_DEPLOY_KEY: ${{ secrets.PHP_MIRROR_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          umask 077
          key_file="${RUNNER_TEMP}/mobilityid-php-mirror-key"
          printf '%s\n' "${MIRROR_DEPLOY_KEY}" > "${key_file}"
          trap 'rm -f "${key_file}"' EXIT
          export GIT_SSH_COMMAND="ssh -i ${key_file} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          mirror="git@github.com:${MIRROR_REPOSITORY}.git"

          existing="$(git ls-remote --tags "${mirror}" "refs/tags/${tag}" | cut -f1)"
          if [[ -n "${existing}" ]]; then
            if [[ "${existing}" == "${SPLIT_SHA}" ]]; then
              echo "Mirror already carries ${tag} at ${SPLIT_SHA}; skipping push."
              exit 0
            fi
            echo "Mirror tag ${tag} points at ${existing}, not at the split ${SPLIT_SHA}; a published Composer version is never moved." >&2
            exit 1
          fi

          git push "${mirror}" "${SPLIT_SHA}:refs/heads/main"
          git push "${mirror}" "${SPLIT_SHA}:refs/tags/${tag}"

  release-scala:
    name: Release Scala to Maven Central
    needs: [preflight-java, preflight-ts, preflight-php, preflight-scala]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: maven-central
    defaults:
      run:
        working-directory: scala
    env:
      # sbt reads SONATYPE_USERNAME/SONATYPE_PASSWORD for central.sonatype.com; sbt-pgp reads
      # PGP_PASSPHRASE for the gpg command line. The key itself is imported below.
      SONATYPE_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.CENTRAL_TOKEN }}
      PGP_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      # Both modules for both Scala versions; sbt artifacts carry no Gradle module metadata.
      SCALA_ARTIFACTS: mobilityid_2.13 mobilityid_3 mobilityid-interpolators_2.13 mobilityid-interpolators_3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup JDK 25 and import the signing key
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"
          # No cache in a publishing workflow (zizmor cache-poisoning).
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: PGP_PASSPHRASE

      - name: Setup sbt
        uses: sbt/setup-sbt@dd1ef7d7798fab5ce802a6adab3b782817b8c2d0 # v1

      - name: Publish to Maven Central
        shell: bash
        run: |
          set -euo pipefail
          read -ra scala_artifacts <<<"${SCALA_ARTIFACTS}"
          status=0
          ../scripts/check-central-release.sh "${RELEASE_VERSION}" --no-module "${scala_artifacts[@]}" || status=$?
          if [[ "${status}" -eq 0 ]]; then
            echo "Scala release ${RELEASE_VERSION} is already available from Maven Central; skipping upload."
            exit 0
          fi
          if [[ "${status}" -ne 1 ]]; then
            echo "Could not determine whether the Scala ${RELEASE_VERSION} artifacts are published; refusing to upload." >&2
            exit "${status}"
          fi
          # publishSigned runs the verifyRelease guard first, stages every Scala version in
          # target/sona-staging, and sonaRelease uploads that single bundle and releases it.
          sbt --server --batch "+publishSigned; sonaRelease"

      - name: Wait for Maven Central resolution
        shell: bash
        run: |
          set -euo pipefail
          read -ra scala_artifacts <<<"${SCALA_ARTIFACTS}"
          for _ in $(seq 1 60); do
            status=0
            ../scripts/check-central-release.sh "${RELEASE_VERSION}" --no-module "${scala_artifacts[@]}" || status=$?
            if [[ "${status}" -eq 0 ]]; then
              exit 0
            fi
            sleep 30
          done
          echo "Scala release did not become resolvable from Maven Central in time." >&2
          echo "Check https://central.sonatype.com/publishing/deployments, then re-run this failed job." >&2
          exit 1

  finalize:
    name: Tag and create GitHub Release
    needs: [release-java, release-ts, release-php, release-scala]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: maven-central
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Checkout published commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Import signing key
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Create or verify signed tag
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          signing_key=$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "sec" { print $5; exit }')
          test -n "${signing_key}"
          umask 077
          GPG_PASSPHRASE_FILE="${RUNNER_TEMP}/mobilityid-gpg-passphrase"
          printf '%s' "${GPG_PASSPHRASE}" > "${GPG_PASSPHRASE_FILE}"
          export GPG_PASSPHRASE_FILE
          git config user.name "mobilityid release workflow"
          git config user.email "actions@users.noreply.github.com"
          git config user.signingkey "${signing_key}"
          git config gpg.program "$(pwd)/scripts/git-gpg-wrapper.sh"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
            tagged_commit=$(git rev-list -n 1 "${tag}")
            [[ "${tagged_commit}" == "${GITHUB_SHA}" ]]
            git tag --verify "${tag}"
          else
            git tag --sign --message "mobilityid ${RELEASE_VERSION}" "${tag}" "${GITHUB_SHA}"
            git tag --verify "${tag}"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${tag}"
          fi

      - name: Create or verify GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            existing_tag=$(gh release view "${tag}" --json tagName --jq .tagName)
            [[ "${existing_tag}" == "${tag}" ]]
          else
            extra=()
            if [[ "${RELEASE_VERSION}" == *-* ]]; then
              extra+=(--prerelease)
            fi
            gh release create "${tag}" \
              --title "mobilityid ${RELEASE_VERSION}" \
              --notes-file ".github/release-notes/${RELEASE_VERSION}.md" \
              --verify-tag "${extra[@]}"
          fi
