name: Pull Request Lifecycle

# Keeps the `Trusted dependency review` status of a commit in step with events that change the
# review set or a base without producing a new commit: a pull request retargeted to another
# base (`edited` with a base change), reopened, or closed while siblings at the same head stay
# open. `Dependency Submission` only reacts to the default `pull_request` activity types, and
# its triggers live in the pull request's own workflow file anyway, so this workflow — run from
# `main`'s definition on `pull_request_target`, which the pull request author cannot suppress —
# re-runs the latest `Dependency Submission` run of the head commit; trusted-dependency-review.yml
# then resets the status to `pending` and recomputes it against the current set of bases.
#
# Metadata only: no checkout, no artifact, no App credential, nothing from the pull request is
# executed. The re-run keeps the privileges of the original run (read-only for forks).
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout, no secret: only re-runs a workflow run by id
    types:
      - edited
      - reopened
      - closed

permissions: {}

concurrency:
  group: pull-request-lifecycle-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  recompute:
    name: Re-run Dependency Submission for the head
    # `edited` also fires for title and body changes: only a base change matters.
    if: >-
      github.event.action != 'edited'
      || toJSON(github.event.changes.base) != 'null'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read

    steps:
      - name: Re-run the latest Dependency Submission run of the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
        run: |
          # Nothing left to review once the last pull request of that commit is closed.
          if [[ "$ACTION" == "closed" ]]; then
            open=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[]' \
              | jq -s --arg sha "$HEAD_SHA" '[.[] | select(.head.sha == $sha)] | length')
            if [[ "${open}" -eq 0 ]]; then
              echo "No open pull request left at ${HEAD_SHA}: nothing to recompute"
              exit 0
            fi
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/dependency-submission.yml/runs?event=pull_request&head_sha=${HEAD_SHA}&per_page=1" \
            --jq '.workflow_runs[0] | {id, status}' > "$RUNNER_TEMP/run.json" || true
          run_id=$(jq -r '.id // empty' "$RUNNER_TEMP/run.json")
          if [[ -z "${run_id}" ]]; then
            echo "::warning::no Dependency Submission run for ${HEAD_SHA}: the pull request run never happened, so no trusted status exists to refresh"
            exit 0
          fi
          # A run still in progress recomputes against the current bases when it completes.
          if [[ "$(jq -r '.status' "$RUNNER_TEMP/run.json")" != "completed" ]]; then
            echo "Dependency Submission run ${run_id} is still running: it will recompute on completion"
            exit 0
          fi
          echo "Re-running Dependency Submission run ${run_id} for ${HEAD_SHA} (${ACTION})"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/${run_id}/rerun" > /dev/null
