version = "3.11.5"
runner.dialect = scala213source3
fileOverride {
  "glob:**/scala-3/**" { runner.dialect = scala3 }
  "glob:**/*.sbt" { runner.dialect = scala3 }
}
maxColumn = 120
align.preset = none
newlines.source = keep
docstrings.style = Asterisk
# Imports are owned by scalafix (OrganizeImports); scalafmt only formats.
rewrite.rules = [RedundantBraces, RedundantParens, SortModifiers]
project.excludePaths = ["glob:**/target/**"]
